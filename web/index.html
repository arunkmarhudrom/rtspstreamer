<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTSP Streamer DVR Monitor</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>DVR Live Monitor</h1>
    <div class="actions">
      <label>Layout
        <select id="layout">
          <option value="4">2x2</option>
          <option value="9">3x3</option>
          <option value="16">4x4</option>
          <option value="20" selected>20</option>
        </select>
      </label>
      <button id="refresh">Refresh Cameras</button>
    </div>
  </header>

  <section class="status-panel">
    <h2>Cameras</h2>
    <table id="camera-table">
      <thead>
      <tr><th>IP</th><th>State</th><th>Clients</th><th>Actions</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="viewer-panel">
    <h2>Canvas Grid Viewer</h2>
    <canvas id="gridCanvas" width="1600" height="900"></canvas>
  </section>

  <div id="hidden-videos" aria-hidden="true"></div>

  <script src="/viewer.js"></script>
</body>
</html>
